<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial & Linear Gradients for Premium Government Emblem Finish -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4BB8"/>
      <stop offset="50%" stop-color="#0B3B8C"/>
      <stop offset="100%" stop-color="#07265E"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="30%" stop-color="#F3B700"/>
      <stop offset="70%" stop-color="#E5A100"/>
      <stop offset="100%" stop-color="#B87D00"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B3B8C" flood-opacity="0.25"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E5A100" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="250" cy="220" r="190" fill="url(#navyGrad)" filter="url(#dropShadow)" />
  
  <!-- Outer Gold Decorative Border -->
  <circle cx="250" cy="220" r="184" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="250" cy="220" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.7"/>

  <!-- Inner Navy Circle -->
  <circle cx="250" cy="220" r="168" fill="#07265E" />

  <!-- Stars Row (Top Emblem Stars) -->
  <!-- Center Star -->
  <path d="M 250 82 L 254 94 L 267 94 L 256 102 L 260 114 L 250 106 L 240 114 L 244 102 L 233 94 L 246 94 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Left Star -->
  <path d="M 215 90 L 218 100 L 228 100 L 220 106 L 223 116 L 215 110 L 207 116 L 210 106 L 202 100 L 212 100 Z" fill="url(#goldGrad)"/>
  <!-- Right Star -->
  <path d="M 285 90 L 288 100 L 298 100 L 290 106 L 293 116 L 285 110 L 277 116 L 280 106 L 272 100 L 282 100 Z" fill="url(#goldGrad)"/>

  <!-- Central Graphic Group (Document + Book + Supporting Hand) -->
  <g transform="translate(0, 10)">
    
    <!-- 1. DOCUMENT ICON (Top/Center background layer) -->
    <g filter="url(#dropShadow)">
      <!-- Document Paper -->
      <path d="M 210 130 L 270 130 C 275 130, 280 135, 280 140 L 280 230 C 280 235, 275 240, 270 240 L 210 240 C 205 240, 200 235, 200 230 L 200 140 C 200 135, 205 130, 210 130 Z" fill="url(#silverGrad)"/>
      <!-- Folded Corner -->
      <path d="M 265 130 L 280 145 L 265 145 Z" fill="#CBD5E1"/>
      
      <!-- Document Content Lines & Checkmarks -->
      <line x1="215" y1="152" x2="250" y2="152" stroke="#0B3B8C" stroke-width="3" stroke-linecap="round"/>
      <line x1="215" y1="168" x2="265" y2="168" stroke="#0B3B8C" stroke-width="3" stroke-linecap="round"/>
      <line x1="215" y1="184" x2="255" y2="184" stroke="#0B3B8C" stroke-width="3" stroke-linecap="round"/>
      <line x1="215" y1="200" x2="265" y2="200" stroke="#0B3B8C" stroke-width="3" stroke-linecap="round"/>

      <!-- Checkmarks in Gold -->
      <path d="M 258 150 L 262 154 L 268 147" fill="none" stroke="#E5A100" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 260 182 L 264 186 L 270 179" fill="none" stroke="#E5A100" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 2. OPEN BOOK ICON (Under/overlapping document base) -->
    <g filter="url(#dropShadow)">
      <!-- Left Page -->
      <path d="M 250 245 Q 210 235, 175 245 L 175 270 Q 210 260, 250 272 Z" fill="#FFFFFF" stroke="#0B3B8C" stroke-width="1.5"/>
      <!-- Right Page -->
      <path d="M 250 245 Q 290 235, 325 245 L 325 270 Q 290 260, 250 272 Z" fill="#FFFFFF" stroke="#0B3B8C" stroke-width="1.5"/>
      <!-- Book Spine & Gold Trim -->
      <path d="M 248 245 L 252 245 L 252 274 L 248 274 Z" fill="url(#goldGrad)"/>
      <path d="M 175 270 Q 210 260, 250 272 Q 290 260, 325 270" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    </g>

    <!-- 3. SUPPORTING HAND ICON (Curved supporting palm at the base) -->
    <g filter="url(#dropShadow)">
      <path d="M 160 280 Q 200 315, 250 315 Q 300 315, 340 280 Q 320 300, 250 328 Q 180 300, 160 280 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
      <!-- Thumb & Palm Detail -->
      <path d="M 170 275 C 185 285, 210 300, 250 300 C 290 300, 315 285, 330 275 C 315 290, 285 308, 250 308 C 215 308, 185 290, 170 275 Z" fill="#F3B700"/>
    </g>
  </g>

  <!-- TEXT BRANDING SECTION INSIDE/BELOW EMBLEM -->
  <!-- "SFF" Bold Acronym Banner -->
  <rect x="180" y="325" width="140" height="34" rx="8" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
  <text x="250" y="349" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#07265E" text-anchor="middle" letter-spacing="3">SFF</text>

  <!-- Circular Arc Text or Main Title "SELF FILL FORMS" -->
  <text x="250" y="392" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="21" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">SELF FILL FORMS</text>
  
  <!-- Outer Banner Ribbon for Tagline -->
  <g transform="translate(0, 10)">
    <rect x="50" y="415" width="400" height="36" rx="18" fill="#07265E" stroke="url(#goldGrad)" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="250" y="438" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">Smart Form Assistant | Citizen Service Helper</text>
  </g>
</svg>
